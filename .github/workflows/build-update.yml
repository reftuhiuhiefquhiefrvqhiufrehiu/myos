name: Build NeonVeil update

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libgbm1 libasound2 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libx11-xcb1
      - name: Install test dependencies
        run: python -m pip install PySide6
      - name: Validate release and run tests
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not os.environ["RELEASE_TAG"].startswith("v"):
              raise SystemExit("Release tag must start with v")
          if os.environ["RELEASE_TAG"].removeprefix("v") != version:
              raise SystemExit("Release tag does not match VERSION")
          if os.environ["RELEASE_PRERELEASE"] == "true" and "-" not in version:
              raise SystemExit("A prerelease must use a prerelease Semantic Version")
          if os.environ["RELEASE_PRERELEASE"] == "false" and "-" in version:
              raise SystemExit("A stable release cannot use a prerelease version")
          PY
          PYTHONPATH=desktop:. QT_QPA_PLATFORM=offscreen \
            python -m unittest discover -s tests -v
      - name: Select release channel
        id: channel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$RELEASE_PRERELEASE" = "false" ]; then
            echo "value=stable" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$RELEASE_TAG" | grep -Eqi -- '-beta([.-]|$)'; then
            echo "value=beta" >> "$GITHUB_OUTPUT"
          else
            echo "value=developer" >> "$GITHUB_OUTPUT"
          fi
      - name: Build update bundle
        env:
          RELEASE_CHANGELOG: ${{ github.event.release.body }}
        run: |
          python scripts/package_update.py \
            --channel "${{ steps.channel.outputs.value }}" \
            --changelog "$RELEASE_CHANGELOG"
      - name: Upload verified update assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/releases/MyOS-*-arm64.tar.gz \
            build/releases/myos-update.json \
            --clobber
